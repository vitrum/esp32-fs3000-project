; ============================================================================
; ESP32-S3-Touch-LCD-2.8 骑行气动测试系统
; 单 FS3000-1015 原型 + BLE 功率计 + BLE 姿态
; + ST7789 显示 + TF 卡日志
;
; 使用 PlatformIO (VS Code 扩展或 CLI)：
;   pio run                # 编译
;   pio run -t upload      # 烧录（Type-C 连接）
;   pio device monitor     # 串口监视
; ============================================================================

[env:esp32s3]
; 固定工具链：Arduino-ESP32 2.0.14 = ESP-IDF 4.4.6
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ---------------------------------------------------------------------------
; 上传设置（修复 "无法烧录 / No serial data received / Device not configured"）
;
; 本板上传走【内置 USB-Serial-JTAG】控制器（USB 设备 303a:1001），
; 而运行时的固件把 USB 重新枚举成 TinyUSB CDC（端口号变为 usbmodem<MAC>）。
; 二者切换需要一次复位 + USB 重枚举，因此必须用 esptool 的 default_reset
; 靠 RTS/DTR 把芯片拉进 ROM bootloader，而不是 1200bps touch。
;
; 之前失败的组合（已废弃）：
;   use_1200bps_touch = yes   → touch 触发固件 CDC 重枚举，PIO 端口跟踪错配
;   before_reset      = no_reset → esptool 不去拉 RTS/DTR，握手窗口错过
;   结果：Auto-detected 到固件端口，却把旧端口传给 esptool，连接/中途掉线。
;
; 若仍偶发大镜像写入中途掉线（USB-Serial-JTAG 在 macOS 上的已知问题），
; 用稳健分块烧录脚本（每块 96KB，自动重试/校验）：
;       tools/flash_chunked.sh
; ---------------------------------------------------------------------------
upload_speed = 115200
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

; 3MB APP 分区（无 OTA）：Arduino_GFX + NimBLE 固件体积较大，
; 使用默认分区可能放不下；本板 16MB Flash 完全够用
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_unflags = -DARDUINO_USB_MODE=1

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  ; TinyUSB CDC + read-only SD MSC, not the hardware USB-Serial/JTAG controller.
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; LVGL 从 src/lv_conf.h 读取配置
  -DLV_CONF_INCLUDE_SIMPLE
  -Isrc

; 保留历史库源码，但本版本不编译或链接 ANT。
lib_ignore = esp32-ant
lib_deps =
  lewisxhe/SensorLib@0.2.6
  ; BLE 客户端（功率计/姿态）+ 手机诊断 GATT 服务，共用一个 NimBLE 栈
  h2zero/NimBLE-Arduino@^2.2.3
  ; ST7789 屏驱动（自定义引脚）
  moononournation/GFX Library for Arduino@1.4.9
  ; LVGL 图形界面（第一版美化 UI）
  lvgl/lvgl@^8.3.11
  ; 可选：BME280 温度/气压（计算空气密度 ρ）
  adafruit/Adafruit BME280 Library@^2.2.4
  ; Wi-Fi 异步 Web 服务器 + WebSocket（实时数据页面，见 plan/wifi-web.md）
  ; 注意：使用 ESP32 core 兼容版本，勿随意升到需要 core 3.x 的版本
  esphome/AsyncTCP-esphome@^2.1.4
  esphome/ESPAsyncWebServer-esphome@^3.2.2
  ; GPS/北斗双模 NMEA 解析（ATGM336H 等），轻量、成熟
  mikalhart/TinyGPSPlus@^1.0.3

