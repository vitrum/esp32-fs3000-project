; ============================================================================
; ESP32-S3-Touch-LCD-2.8 骑行气动测试系统
; 单 FS3000-1015 原型 + BLE/ANT+ 功率计 + BLE 姿态
; + ST7789 显示 + TF 卡日志
;
; 使用 PlatformIO (VS Code 扩展或 CLI)：
;   pio run                # 编译
;   pio run -t upload      # 烧录（Type-C 连接）
;   pio device monitor     # 串口监视
; ============================================================================

[env:esp32s3]
; 固定 6.5.0：与 esp32-ant 库作者验证过的工具链一致
; （Arduino-ESP32 2.0.14 = ESP-IDF 4.4.6，ANT 射频后端索引已核对）
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ---------------------------------------------------------------------------
; 安全上传设置（防止大固件写入时 USB-CDC 掉线 / "Device not configured"）
;   - upload_speed 降到 115200：本板走原生 USB-CDC，高波特率(921600)在写
;     大镜像(>2MB)时偶发掉线；115200 实测稳定。
;   - upload_resetmethod / upload_flags：使用默认复位进入下载模式，
;     追加 --no-stub 关闭 stub（在部分 USB 链路下更稳），并在写入后硬复位。
;   - 若仍偶发掉线，固件可用分块烧录脚本（512KB/块）逐段写入：
;       0x0     bootloader.bin
;       0x8000  partitions.bin
;       0x10000 firmware.bin（按 0x80000 步长切块）
; ---------------------------------------------------------------------------
upload_speed = 115200
upload_resetmethod = default_reset

; 3MB APP 分区（无 OTA）：Arduino_GFX + NimBLE + ANT 栈固件体积较大，
; 使用默认分区可能放不下；本板 16MB Flash 完全够用
board_build.partitions = huge_app.csv

build_flags =
  ; 原生 USB 串口：启用后 Type-C 直接输出 Serial 日志
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; LVGL 从 src/lv_conf.h 读取配置
  -DLV_CONF_INCLUDE_SIMPLE
  -Isrc

; 开机/关机音效直接编译进固件（无需 SD 卡）。
; 通过 _binary_assets_boot_wav_start / _binary_assets_shutdown_wav_start
; 符号在 audio.cpp 中引用。文件：assets/boot.wav / assets/shutdown.wav
board_build.embed_files =
  assets/boot.wav
  assets/shutdown.wav

; 本地 ANT+ 库：code/lib/ant/（esp32-ant，Apache-2.0），PlatformIO 自动发现，
; 无需网络拉取（library.json 位于该目录下）
lib_deps =
  ; BLE 客户端（功率计/姿态），替代传统 BLEDevice，更省资源
  h2zero/NimBLE-Arduino@^2.2.3
  ; ST7789 屏驱动（自定义引脚）
  moononournation/GFX Library for Arduino@1.4.9
  ; LVGL 图形界面（第一版美化 UI）
  lvgl/lvgl@^8.3.11
  ; 可选：BME280 温度/气压（计算空气密度 ρ）
  adafruit/Adafruit BME280 Library@^2.2.4
  ; Wi-Fi 异步 Web 服务器 + WebSocket（实时数据页面，见 plan/wifi-web.md）
  ; 注意：使用 ESP32 core 兼容版本，勿随意升到需要 core 3.x 的版本
  esphome/AsyncTCP-esphome@^2.1.4
  esphome/ESPAsyncWebServer-esphome@^3.2.2
  ; 音频：I2S 外置 DAC(PCM5101) 播放 MP3（SD 卡内文件）+ 提示音
  ; 注：PlatformIO 注册表中作者名为 esphome，实际即 schreibfaul1 的 ESP32-audioI2S
  esphome/ESP32-audioI2S@^2.3.0
  ; GPS/北斗双模 NMEA 解析（ATGM336H 等），轻量、成熟
  mikalhart/TinyGPSPlus@^1.0.3


