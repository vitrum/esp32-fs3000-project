; ============================================================================
; 单 FS3000-1015 风速显示简化版（独立小工程，与双传感器主工程互不影响）
;   pio run             # 编译
;   pio run -t upload   # 烧录
; ============================================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  moononournation/GFX Library for Arduino@^1.4.10
